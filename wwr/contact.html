<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This is the contact page for The Rapids whitewater rafting company.
    It contains contact information for the company.">
    <meta name="author" content="Somtochukwu Agbo">
    <title>Contact Us - The Rapids</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-therapidssplash.jpg" alt="The Rapids Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="company-info">
            <h1>The Rapids</h1>
            <address>
                <p>123 Main River Street</p>
                <p>Kolob, California</p>
                <p><a href="tel:+19999999999">+1 999 999 9999</a></p>
                <p><a href="mailto:info@therapids.com">info@therapids.com</a></p>
            </address>
        </section>
        <section class="contact-container">
            <div class="map-container">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3132.6198373904285!2d-122.0744641!3d38.2651222!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808516af083847c1%3A0xe40c43fb5f1dea2f!2sKolob%20Way%2C%20Fairfield%2C%20CA%2094534%2C%20USA!5e0!3m2!1sen!2sng!4v1790945880001!5m2!1sen!2sng"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form action="#" method="post" class="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Placeholder" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder" required>
                </div>
                <fieldset class="form-group radio-group">
                    <legend>Message Purpose</legend>
                    <label>
                        <input type="radio" name="purpose" id="purpose-general" value="general"
                          checked>
                        General Inquiry
                    </label>
                    <label>
                        <input type="radio" name="purpose" id="purpose-reservation"
                          value="reservation">
                        Reservation Question
                    </label>
                    <label>
                        <input type="radio" name="purpose" id="purpose-suggestion"
                          value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type here"
                      required></textarea>
                </div>
                <div class="form-group checkbox-group">
                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter" checked>
                        Please Subscribe me to the monthly newsletter
                    </label>
                </div>
                <button type="submit" class="submit-btn">Get in Touch!</button>
            </form>
        </section>
        <section class="team-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure class="employee-card">
                    <img src="images/employeepic.jpg" alt="Employee Profile">
                    <figcaption>Jason Cook (Managing Director)</figcaption>
                </figure>
                <figure class="employee-card">
                    <img src="images/employeepic2.jpg" alt="Employee Profile">
                    <figcaption>Bob Stone (Lead Journeyman)</figcaption>
                </figure>
                <figure class="employee-card">
                    <img src="images/employeepic3.jpg" alt="Employee Profile">
                    <figcaption>Sasha Ashes (Project Manager)</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 🌍 The Rapids 🌍 Somtochukwu Agbo</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin2.png" alt="Linkedin Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.jpg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
