<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>

    </header>
    <main>
        <form>
            <label for="question1">What does the acronym CSS stand for? </label>
            <input type="text" id="question1" name="question1">

            <label for="q2">How are id and class attributes selected in CSS? </label>
            <textarea id="q2" maxlength="q2" rows="4"></textarea>

            <label for="q3">Which of the following is a valid CSS comment?</label>
            <select name="q3" id="q3">
                <option value="" selected disabled>Choose one...</option>
                <option value="1">/* This is a comment */</option>
                <option value="2">//This is a comment</option>
                <option value="3">!-- This is a comment --</option>
            </select>

            <label for="q4">What is the bottom margin given in this declaration?</label>
            <code class="code-block">margin: 10px 5px 15px;</code>
            <input type="number" id="q4" name="q4">

            <button type="submit">Submit Quiz</button>
        </form>

    </main>
    <footer>

    </footer>
</body>

</html>
